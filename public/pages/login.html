<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Skill Exchange</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <img src="../assets/images/file_00000000cb3881f498e1ff3461647e11.png" alt="Skill Exchange Logo">
      <span>SkillExchange</span>
    </div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="signup.html">Sign Up</a>
    </nav>
  </header>

  <section class="auth-section">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p class="auth-subtitle">Log in to your Skill Exchange account.</p>

      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@email.com" required>

        <label for="loginPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
          <button type="button" id="toggleLoginPassword" class="toggle-password">Show</button>
        </div>

        <p id="loginMessage" class="form-message"></p>

        <button type="submit" class="btn-primary btn-large btn-full">Log In</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/auth.js"></script>

</body>
  </html>
