<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Skill Exchange</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <img src="../assets/images/file_00000000cb3881f498e1ff3461647e11.png" alt="Skill Exchange Logo">
      <span>SkillExchange</span>
    </div>
    <div class="nav-menu-wrapper">
      <a href="profile.html" class="avatar-link">
        <img id="navAvatar" src="" alt="" class="nav-avatar-icon">
        <span id="notifBadge" class="notif-badge hidden">0</span>
      </a>
      <button id="menuToggle" class="menu-toggle" aria-label="Menu">☰</button>
      <div id="dropdownMenu" class="dropdown-menu">
        <a href="dashboard.html">Dashboard</a>
        <a href="requests.html">Requests</a>
        <a href="profile.html">My Profile</a>
        <a href="#" id="logoutBtn">Log Out</a>
      </div>
    </div>
  </header>

  <section class="profile-page">

    <div class="profile-cover">
      <div class="avatar-wrapper">
        <img id="avatarPreview" src="" alt="Profile picture" class="avatar-img">
        <label for="avatarInput" class="avatar-edit-btn">📷</label>
        <input type="file" id="avatarInput" accept="image/*" hidden>
      </div>
    </div>

    <div class="request-banner hidden" id="requestBanner">
      <p id="requestBannerText"></p>
      <a href="requests.html" class="btn-small btn-accept">View</a>
    </div>

    <div class="profile-info">
      <h1 id="displayName">Loading...</h1>
      <p id="displayBio" class="profile-bio"></p>

      <div class="chip-group">
        <h4>Can Teach</h4>
        <div id="teachChips" class="chip-row"></div>
      </div>

      <div class="chip-group">
        <h4>Wants to Learn</h4>
        <div id="learnChips" class="chip-row"></div>
      </div>

      <button id="editToggleBtn" class="btn-primary btn-large">Edit Profile</button>
    </div>

    <form id="profileForm" class="profile-card hidden">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" required>

      <label for="bio">Bio</label>
      <textarea id="bio" rows="3" placeholder="Tell other students a bit about yourself..."></textarea>

      <label for="teachSkillsInput">Skills I Can Teach</label>
      <div class="tag-input-wrapper">
        <div id="teachTags" class="tag-list"></div>
        <input type="text" id="teachSkillsInput" placeholder="Type a skill...">
        <div id="teachSuggestions" class="suggestions-dropdown"></div>
      </div>

      <label for="learnSkillsInput">Skills I Want to Learn</label>
      <div class="tag-input-wrapper">
        <div id="learnTags" class="tag-list"></div>
        <input type="text" id="learnSkillsInput" placeholder="Type a skill...">
        <div id="learnSuggestions" class="suggestions-dropdown"></div>
      </div>

      <p id="profileMessage" class="form-message"></p>

      <div class="form-btn-row">
        <button type="submit" class="btn-primary btn-large">Save Changes</button>
        <button type="button" id="cancelEditBtn" class="btn-secondary">Cancel</button>
      </div>
    </form>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/profile.js"></script>

</body>
  </html>
