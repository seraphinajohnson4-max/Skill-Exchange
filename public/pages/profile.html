<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Skill Exchange</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <img src="../assets/images/file_00000000cb3881f498e1ff3461647e11.png" alt="Skill Exchange Logo">
      <span>SkillExchange</span>
    </div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="#" id="logoutBtn">Log Out</a>
    </nav>
  </header>

  <section class="profile-section">
    <h1>My Profile</h1>
    <p class="auth-subtitle">This is what other students will see.</p>

    <form id="profileForm" class="profile-card">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" required>

      <label for="bio">Bio</label>
      <textarea id="bio" rows="3" placeholder="Tell other students a bit about yourself..."></textarea>

      <label for="skillsToTeach">Skills I Can Teach</label>
      <input type="text" id="skillsToTeach" placeholder="e.g. Guitar, Python, Public Speaking">

      <label for="skillsToLearn">Skills I Want to Learn</label>
      <input type="text" id="skillsToLearn" placeholder="e.g. Spanish, Excel, Photography">

      <p id="profileMessage" class="form-message"></p>

      <button type="submit" class="btn-primary btn-large btn-full">Save Profile</button>
    </form>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="../assets/js/profile.js"></script>

</body>
</html>
